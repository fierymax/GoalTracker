name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub 现在默认给 GITHUB_TOKEN 只读权限，没有这个会 403，导致打包器以失败退出
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 诊断步骤：没配 token 时打包器会静默跳过 CurseForge 上传（退出码仍是 0），
      # 这里显式失败，避免"绿色对勾但其实没上传"的假成功
      - name: Verify CurseForge token
        env:
          HAS_CF_TOKEN: ${{ secrets.CF_API_TOKEN != '' || secrets.CF_API_KEY != '' }}
        run: |
          if [ "$HAS_CF_TOKEN" != "true" ]; then
            echo "::error::Neither CF_API_TOKEN nor CF_API_KEY secret is set."
            echo "::error::Add it in Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "::error::Token comes from https://authors.curseforge.com/account/api-tokens"
            exit 1
          fi
          echo "CurseForge token secret is present."

      # 用 BigWigsMods 官方打包器：按 .pkgmeta 生成插件 zip
      # 不配置密钥时只本地出包；配了密钥会自动投递 CurseForge / Wago / GitHub Release
      - name: Package addon
        uses: BigWigsMods/packager@v2
        env:
          # 打包器先读 CF_API_KEY 再读 CF_API_TOKEN，两个都传，避免 secret 取名不一致导致静默跳过
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalTracker
          path: .release/*.zip
          if-no-files-found: warn

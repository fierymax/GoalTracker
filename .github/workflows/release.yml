name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub 现在默认给 GITHUB_TOKEN 只读权限，没有这个会 403，导致打包器以失败退出
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 用 BigWigsMods 官方打包器：按 .pkgmeta 生成插件 zip
      # 不配置密钥时只本地出包；配了密钥会自动投递 CurseForge / Wago / GitHub Release
      - name: Package addon
        uses: BigWigsMods/packager@v2
        env:
          # 注意变量名：packager v2 读的是 CF_API_TOKEN，不是 CF_API_KEY
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalTracker
          path: .release/*.zip
          if-no-files-found: warn
